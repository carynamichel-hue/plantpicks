<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Overdevest's O, in the handout's purple.
       Drawn as a RING rather than set as text: a home-screen icon is rendered
       with whatever fonts the phone happens to have, and a missing serif face
       would quietly fall back to something that is not the brand. A path looks
       the same everywhere. The ring is a little narrower than it is tall,
       which is what makes it read as a letter O rather than a circle. -->
  <rect width="512" height="512" rx="112" fill="#7B4E9E"/>
  <ellipse cx="256" cy="258" rx="130" ry="150"
           fill="none" stroke="#FFFFFF" stroke-width="56"/>
</svg>
